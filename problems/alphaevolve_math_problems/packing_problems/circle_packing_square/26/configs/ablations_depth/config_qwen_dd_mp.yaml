SYS_MSG: |
  # PROMPT-BLOCK-START
  SETTING:
  You are an expert computational geometer and optimization specialist focusing on circle packing problems.
  Your task is to evolve a constructor function that generates an optimal arrangement of exactly 26 non-overlapping circles within a unit square [0,1] × [0,1], maximizing the sum of their radii.

  PROBLEM CONTEXT:
  - Target: Beat the AlphaEvolve benchmark of sum_radii = 2.6358627564136983
  - Constraint: All circles must be fully contained within the unit square with no overlaps
  - Mathematical formulation: For circle i at position (xi, yi) with radius ri:
    * Containment: ri ≤ xi ≤ 1-ri and ri ≤ yi ≤ 1-ri
    * Non-overlap: √[(xi-xj)² + (yi-yj)²] ≥ ri + rj for all i≠j
    * Objective: maximize Σri subject to above constraints

  COMPUTATIONAL BUDGET:
  - **Time limit**: 60 seconds maximum execution time
  - **Memory limit**: 1 GB

  COMPUTATIONAL RESOURCES & IMPLEMENTATION GUIDELINES:
  **Core packages**: numpy, scipy, sympy, pandas, networkx, jax, torch, numba, scikit-learn

  **Additional useful packages**:
  - **Optimization**: `deap` (evolutionary algorithms), `platypus` (multi-objective optimization)
  - **Geometric computing**: `shapely` (geometric operations), `rtree` (spatial indexing), `scipy.spatial` (KDTree, Voronoi)
  - **Constraint programming**: `python-constraint`, `ortools` (Google OR-Tools)
  - **Physics simulation**: `pymunk` (2D physics), `pybullet` (physics engine)
  - **Performance**: `cython`, `joblib` (parallelization)

  PERFORMANCE METRICS:
  1. **sum_radii**: Total sum of all 26 circle radii (PRIMARY OBJECTIVE - maximize)
  2. **benchmark_ratio**: sum_radii / 2.6358627564136983 (progress toward beating benchmark)  
  3. **eval_time**: Execution time in seconds (keep reasonable, prefer accuracy over speed)

  TECHNICAL REQUIREMENTS:
  - **Determinism**: Use fixed random seeds if employing stochastic methods for reproducibility
  - **Error handling**: Graceful handling of optimization failures or infeasible configurations
  - **Memory efficiency**: Avoid excessive memory allocation for distance matrix computations
  - **Scalability**: Design with potential extension to different circle counts in mind

  # PROMPT-BLOCK-END
      
CODEBASE_PATH: 'src/'
INIT_FILE_DATA: {filename: 'init_program.py', language: 'python'}
EVAL_FILE_NAME: 'evaluate.py'
EVAL_TIMEOUT: 60

MAX_MEM_BYTES: 1000000000
MEM_CHECK_INTERVAL_S: 0.1

EVOLVE_CONFIG: {fitness_key: 'benchmark_ratio',
                num_epochs: 300,ckpt: 20,max_size: null,init_pop: 20,
                exploration_rate: 0.8, 
                selection_policy: 'random',
                early_stopping_rounds: 300,
                num_islands: 3, migration_topology: 'ring', migration_interval: 50, migration_rate: 0.1,
                meta_prompting: True, use_embedding: False, use_map_elites: True,
                num_inspirations: 2,
                max_chat_depth: 3,
                mp_start_marker: "# PROMPT-BLOCK-START", mp_end_marker: "# PROMPT-BLOCK-END",
                evolve_start_marker: "# EVOLVE-BLOCK-START", evolve_end_marker: "# EVOLVE-BLOCK-END",
                use_scheduler: True, type: 'ExponentialDecayScheduler', scheduler_kwargs: {min_rate: 0.2, max_rate: 0.8, decay_weight: 0.95},
                use_dynamic_depth: True
                }

ENSEMBLE: [{model_name: 'AWS_QWEN-QWEN3-CODER-30B-INSTRUCT', temp: 0.7, top_p: 0.8, retries: 3, weight: 1, verify_ssl: False}]

SAMPLER_AUX_LM : {model_name: 'AWS_QWEN-QWEN3-CODER-30B-INSTRUCT', temp: 0.7, top_p: 0.8, retries: 3, weight: 1, verify_ssl: False}

EMBEDDING: {model_name: 'AZURE_TEXT-EMBEDDING-3-SMALL', retries: 3, verify_ssl: False, dimensions: 128}

MAP_ELITES: {elite_map_type: 'grid',
             features: [
              {name: 'radii_sum', min_val: 0, max_val: 3, num_bins: 100},
              {name: 'benchmark_ratio', min_val: 0, max_val: 1.5, num_bins: 100},
              {name: 'eval_time', min_val: 0, max_val: 180, num_bins: 10},
             ]}

